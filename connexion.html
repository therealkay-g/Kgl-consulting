    <!-- Filet de securite : sans JS, #preloader (position:fixed, inset:0) masque
         tout le site et les elements [data-animate] restent en opacity:0.
         On retire les deux blocages pour que la page reste lisible. -->
    <noscript>
        <style>
            #preloader { display: none !important; }
            [data-animate] { opacity: 1 !important; transform: none !important; clip-path: none !important; }
            #cursor, #cursor-follower, #scroll-progress { display: none !important; }
            #page-transition-overlay, .ambient-glow-top, .ambient-glow-bottom { display: none !important; }
        </style>
    </noscript>

<body class="auth-page">
    <noscript>
        <div class="nojs-banner">
            <p><strong>JavaScript est desactive.</strong> La page reste consultable, mais certains elements interactifs ne repondent pas.</p>
            <a href="https://wa.me/243812430023" class="nojs-banner-cta" rel="noopener">Nous ecrire sur WhatsApp</a>
        </div>
    </noscript>

    <div class="auth-container">
        <div class="auth-box" data-animate="fade-up">
            <a href="index.html" class="auth-logo">
                <img src="images/logo-kgl.jpg" alt="KGL Management" decoding="async" width="236" height="126" loading="eager">
            </a>
            <h1 data-i18n="login.title">Bienvenue</h1>
            <p data-i18n="login.desc">Connectez-vous à votre portail sécurisé pour suivre vos missions et accéder à vos rapports.</p>

            <form class="premium-form">
                <div class="form-group">
                    <label data-i18n="login.email">E-mail professionnel</label>
                    <input type="email" placeholder="nom@entreprise.com" data-i18n-placeholder="login.emailPlaceholder" required>
                </div>
                <div class="form-group">
                    <label data-i18n="login.password">Mot de passe</label>
                    <input type="password" placeholder="••••••••" data-i18n-placeholder="login.passPlaceholder" required>
                </div>
                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox"> <span data-i18n="login.remember">Se souvenir de moi</span>
                    </label>
                    <a href="contact.html" class="forgot-pass" data-i18n="login.forgot">Mot de passe oublié ?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block" data-i18n="login.submit">Se connecter</button>
            </form>

            <div class="auth-footer">
                <p><span data-i18n="login.newClient">Nouveau client ?</span> <a href="contact.html" data-i18n="login.requestAccess">Demandez vos accès</a></p>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

        <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/script.js"></script>
    <script src="js/premium-upgrades.js"></script>
    <script src="js/ultra-premium.js"></script>
</body>

</html>
